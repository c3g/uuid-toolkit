name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - production-setup
      - main

  pull_request:
    branches:
      - main


jobs:

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-vite
        run: npm run lint

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build


  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: uuid_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: uuid_toolkit_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U uuid_app -d uuid_toolkit_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://uuid_app:test_password@127.0.0.1:5432/uuid_toolkit_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v